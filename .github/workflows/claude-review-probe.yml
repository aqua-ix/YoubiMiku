# TEMPORARY diagnostic workflow. Delete once the code-review allowedTools list
# is confirmed working. It mirrors claude-code-review.yml but is manually
# dispatchable and prints which tools the run was denied, which the normal
# workflow hides ("full output hidden for security" only reports a count).
name: Claude Review Denial Probe

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to review'
        required: true
      comment:
        description: 'Pass --comment so the plugin actually posts its review'
        required: false
        default: 'false'

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.inputs.pr }}${{ github.event.inputs.comment == 'true' && ' --comment' || '' }}"
          claude_args: >-
            --allowedTools "Skill,Agent,Task,TodoWrite,TaskCreate,TaskUpdate,TaskList,Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git blame:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git rev-parse:*)"

      - name: Report permission denials
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo "No execution file produced"
            exit 0
          fi
          echo "### Denials by tool"
          jq -r '[.[] | select(.type == "result") | .permission_denials[]?]
                 | if length == 0 then "none"
                   else group_by(.tool_name)
                        | map("\(length)\t\(.[0].tool_name)")
                        | .[]
                   end' "$EXECUTION_FILE"
          echo "### Denied invocations (truncated)"
          jq -r '[.[] | select(.type == "result") | .permission_denials[]?]
                 | .[]
                 | "\(.tool_name)\t\((.tool_input.command // .tool_input.subagent_type // .tool_input.file_path // .tool_input.pattern // "") | tostring | .[0:200])"' "$EXECUTION_FILE"
          echo "### Tool calls in order"
          jq -r '.[] | select(.type == "assistant") | .message.content[]?
                 | select(.type == "tool_use")
                 | "\(.name)\tbg=\(.input.run_in_background // false)\t\((.input.subagent_type // .input.skill // .input.command // .input.description // "") | tostring | .[0:120])"' "$EXECUTION_FILE"
          echo "### Tool results that errored"
          jq -r '.[] | select(.type == "user") | .message.content[]?
                 | select(.type == "tool_result" and .is_error == true)
                 | (.content | tostring | .[0:300])' "$EXECUTION_FILE"
          echo "### Final result text (truncated)"
          jq -r '[.[] | select(.type == "result") | .result // ""] | .[0] | .[0:3000]' "$EXECUTION_FILE"
